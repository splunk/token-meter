{
  "schema_version": 1,
  "coordinator": {
    "owner": "primary-agent",
    "specialist_delegation_depth": 1,
    "default_execution": "direct",
    "authoritative_state_owner": true
  },
  "task_classes": {
    "direct-response": {
      "skill": "token-meter-intake",
      "route": ["coordinator", "communication-manager", "coordinator"],
      "external_write_requires_approval": true
    },
    "triage": {
      "skill": "token-meter-intake",
      "route": ["coordinator"],
      "output": "acceptance-criteria-and-route"
    },
    "communication": {
      "skill": "token-meter-communication",
      "route": [
        "coordinator",
        "communication-manager",
        "authorized-channel-operator"
      ],
      "applies_to": [
        "slack",
        "github",
        "release-communication",
        "contributor-communication",
        "user-facing-status"
      ],
      "separation_of_duties": {
        "communication-manager": "draft-and-quality-gate",
        "authorized-operator": "external-write-and-read-back"
      },
      "principles": [
        "evidence-before-claims",
        "channel-appropriate-detail",
        "concise-by-default",
        "privacy-and-sensitive-data-minimization",
        "explicit-delivery-state-language",
        "no-invented-diagnosis-deadline-or-commitment",
        "approval-scope-preservation",
        "deduplicate-before-send",
        "read-back-after-write"
      ],
      "external_write_requires_approval": true
    },
    "reporter-end-to-end": {
      "skill": "token-meter-intake",
      "route": [
        "coordinator",
        "developer",
        "coordinator",
        "tester+reviewer",
        "coordinator",
        "communication-manager",
        "github-operator",
        "communication-manager",
        "github-operator",
        "coordinator"
      ],
      "delivery_order": [
        "developer-implements-scoped-change",
        "coordinator-commits-scoped-change",
        "tester-and-reviewer-gate-exact-commit",
        "communication-manager-drafts-pull-request",
        "github-operator-pushes-branch-and-creates-pull-request",
        "communication-manager-drafts-linked-handoffs",
        "github-operator-posts-linked-issue-handoff",
        "coordinator-posts-slack-follow-up"
      ],
      "standing_approval_trigger": "explicit-token-meter-team-flow-or-end-to-end-request",
      "standing_approval_scope": [
        "scoped-commit",
        "dedicated-branch-push",
        "linked-pull-request",
        "github-reporter-testing-handoff",
        "concise-slack-pr-follow-up"
      ],
      "slack_follow_up": {
        "format": "one-short-paragraph",
        "required": [
          "thanks",
          "pull-request-link",
          "brief-try-request",
          "pratiks-agent-signature"
        ],
        "forbidden": [
          "code",
          "commands",
          "clone-or-install-steps",
          "procedural-next-steps",
          "test-matrix"
        ]
      },
      "github_handoff": {
        "location": "linked-issue",
        "content": "detailed-clone-install-restore-and-test-instructions"
      },
      "separately_approved_actions": [
        "merge",
        "release",
        "close",
        "label",
        "hosted-review-request"
      ],
      "recheck_readiness_before_action": true,
      "invalidate_evidence_on_tracked_change": true
    },
    "low-risk-fast-path": {
      "skill": "token-meter-development",
      "route": ["coordinator-or-developer", "coordinator"],
      "writer": "assigned-single-writer",
      "review_gate": "fast_path",
      "eligibility": "all-conditions-in-review-policy",
      "required_qualification": [
        "selected-allowed-change-kind",
        "eligibility-evidence"
      ],
      "independent_testing_required": false,
      "independent_review_required": false,
      "installed_runtime_required_by_default": false,
      "invalidate_evidence_on_tracked_change": true
    },
    "diagnosis-only": {
      "skill": "token-meter-development",
      "route": ["developer", "coordinator"],
      "writer": null,
      "implementation_authorized": false
    },
    "bounded-code-change": {
      "skill": "token-meter-development",
      "route": ["developer", "tester+reviewer", "coordinator", "communication-manager", "github-operator"],
      "writer": "developer",
      "parallel_read_only_step": ["tester", "reviewer"],
      "invalidate_evidence_on_tracked_change": true
    },
    "architectural-change": {
      "skill": "token-meter-development",
      "route": ["approved-design", "approved-plan", "developer", "tester+reviewer", "coordinator", "communication-manager", "github-operator"],
      "writer": "developer",
      "parallel_read_only_step": ["tester", "reviewer"],
      "invalidate_evidence_on_tracked_change": true
    },
    "verification-only": {
      "skill": "token-meter-verification",
      "route": ["tester", "coordinator"],
      "writer": null
    },
    "review-only": {
      "skill": "token-meter-review",
      "route": ["reviewer", "coordinator"],
      "writer": null
    },
    "external-review-feedback": {
      "skill": "token-meter-review",
      "route": ["reviewer", "coordinator", "developer-if-accepted", "tester+reviewer"],
      "verify_before_fix": true,
      "invalidate_evidence_on_tracked_change": true
    },
    "documentation-only": {
      "skill": "token-meter-development",
      "route": ["coordinator-or-developer", "proportionate-review"],
      "writer": "assigned-single-writer",
      "review_gate": "fast_path-if-eligible-otherwise-standard"
    },
    "github-operation": {
      "skill": "token-meter-github-ops",
      "route": ["coordinator", "communication-manager", "github-operator"],
      "external_write_requires_approval": true,
      "recheck_readiness_before_action": true
    }
  },
  "risk_overrides": [
    "privacy-boundary",
    "pricing-semantics",
    "provider-parsing",
    "deletion",
    "persistence",
    "installer-or-staged-runtime",
    "native-menu",
    "cross-platform",
    "shared-helper"
  ],
  "states": [
    "intake",
    "accepted",
    "developing",
    "verifying-and-reviewing",
    "fix-required",
    "ready-to-merge",
    "closed",
    "blocked"
  ],
  "transitions": {
    "intake": ["accepted", "blocked", "closed"],
    "accepted": ["developing", "verifying-and-reviewing", "blocked", "closed"],
    "developing": ["verifying-and-reviewing", "blocked"],
    "verifying-and-reviewing": ["fix-required", "ready-to-merge", "blocked"],
    "fix-required": ["developing", "blocked"],
    "ready-to-merge": ["closed", "blocked"],
    "blocked": ["accepted", "developing", "verifying-and-reviewing", "closed"],
    "closed": []
  },
  "task_envelope_required": [
    "objective",
    "mode",
    "acceptance_criteria",
    "scope",
    "non_goals",
    "risk_lenses",
    "allowed_actions",
    "worktree",
    "base_commit",
    "head_commit",
    "required_output",
    "escalation_conditions"
  ],
  "worker_result_required": [
    "status",
    "head_commit",
    "evidence",
    "findings",
    "unverified",
    "blockers",
    "recommended_next_state"
  ]
}
