<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="t d">
  <title id="t">How the Token Meter Work page works</title>
  <desc id="d">Agent traces become session summaries; a local model labels each request's work type, area, complexity, and pushback, and each request carries its share of the cost; labels become outcomes, tags, and model-efficiency suggestions shown on the Work page. Setup installs a pinned Ollama and model on this Mac.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06080b"/>
      <stop offset=".45" stop-color="#0b1015"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c25"/>
      <stop offset="1" stop-color="#0d1218"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f8adf"/>
      <stop offset="1" stop-color="#00bceb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4c6a85"/>
    </marker>
    <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#02bceb"/>
      <rect width="3" height="8" fill="#c17a01"/>
    </pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;fill:#f6f8fb}
      .h1{font-size:36px;font-weight:800;letter-spacing:-.5px}
      .sub{font-size:16px;fill:#a8b3c1}
      .eye{font-size:12px;font-weight:800;letter-spacing:1.4px;fill:#7fdbf2}
      .h3{font-size:17px;font-weight:700}
      .h4{font-size:14px;font-weight:700}
      .t{font-size:13px;fill:#a8b3c1}
      .s{font-size:12px;fill:#7d8ba0}
      .num{font-size:13px;font-weight:700;fill:#66d990}
      .card{fill:url(#panel);stroke:rgba(255,255,255,.085);stroke-width:1}
      .line{stroke:#4c6a85;stroke-width:2;fill:none}
    </style>
  </defs>

  <rect width="1600" height="1600" fill="url(#bg)"/>

  <!-- Header -->
  <text class="h1" x="60" y="86">How the Work page works</text>
  <text class="sub" x="60" y="118">What your agent spend went into, how often it worked, and where a cheaper model would have done. Everything runs on this Mac.</text>
  <g transform="translate(1316 62)">
    <rect width="224" height="40" rx="20" fill="rgba(102,217,144,.10)" stroke="rgba(102,217,144,.45)"/>
    <path d="M22 16h10v-3a5 5 0 0 0-10 0v3zm-3 0h16v13h-16z" fill="none" stroke="#66d990" stroke-width="2" transform="translate(0 -1)"/>
    <text x="48" y="25" style="font-size:13px;font-weight:700;fill:#66d990">Local only · labels, not text</text>
  </g>

  <!-- Section: data flow -->
  <text class="eye" x="60" y="170">DATA FLOW</text>
  <g>
    <rect class="card" x="60" y="186" width="264" height="140" rx="12"/>
    <rect x="60" y="186" width="264" height="4" rx="2" fill="#5f8adf"/>
    <text class="h3" x="80" y="224">Agent traces</text>
    <text class="t" x="80" y="250">Claude, Codex, Cursor, OpenCode,</text>
    <text class="t" x="80" y="270">Kiro, and others, read in place.</text>
    <text class="s" x="80" y="302">Never copied or uploaded</text>

    <rect class="card" x="364" y="186" width="264" height="140" rx="12"/>
    <rect x="364" y="186" width="264" height="4" rx="2" fill="#9979cd"/>
    <text class="h3" x="384" y="224">Session summaries</text>
    <text class="t" x="384" y="250">Cost, model, reasoning effort,</text>
    <text class="t" x="384" y="270">requests, active time, subagents.</text>
    <text class="s" x="384" y="302">Same numbers as the rest of the app</text>

    <rect class="card" x="668" y="186" width="264" height="140" rx="12" style="stroke:#00bceb;stroke-opacity:.7"/>
    <rect x="668" y="186" width="264" height="4" rx="2" fill="#00bceb"/>
    <text class="h3" x="688" y="224">Local model</text>
    <text class="t" x="688" y="250">Jet (4B) in Ollama on 127.0.0.1</text>
    <text class="t" x="688" y="270">reads each typed request, the reply</text>
    <text class="t" x="688" y="290">before it, and the files changed.</text>
    <text class="s" x="688" y="312">Text stays in memory · pauses on battery</text>

    <rect class="card" x="972" y="186" width="264" height="140" rx="12"/>
    <rect x="972" y="186" width="264" height="4" rx="2" fill="#05a386"/>
    <text class="h3" x="992" y="224">Label store</text>
    <text class="t" x="992" y="250">Salted session keys, labels,</text>
    <text class="t" x="992" y="270">confidence, prompt version.</text>
    <text class="s" x="992" y="302">No prompt or reply text is kept</text>

    <rect class="card" x="1276" y="186" width="264" height="140" rx="12"/>
    <rect x="1276" y="186" width="264" height="4" rx="2" fill="url(#glow)"/>
    <text class="h3" x="1296" y="224">Work page</text>
    <text class="t" x="1296" y="250">Outcomes, tags, rhythm, and</text>
    <text class="t" x="1296" y="270">model-efficiency suggestions.</text>
    <text class="s" x="1296" y="302">Select a bar or tag to see sessions</text>

    <path class="line" d="M326 256H360" marker-end="url(#arrow)"/>
    <path class="line" d="M630 256H664" marker-end="url(#arrow)"/>
    <path class="line" d="M934 256H968" marker-end="url(#arrow)"/>
    <path class="line" d="M1238 256H1272" marker-end="url(#arrow)"/>
    <path class="line" d="M800 328V358" marker-end="url(#arrow)"/>
  </g>

  <!-- Questions -->
  <rect class="card" x="364" y="362" width="872" height="124" rx="12"/>
  <text class="eye" x="384" y="390">WHAT THE LOCAL MODEL ANSWERS</text>
  <g>
    <text class="h4" x="384" y="418">Work type</text>
    <text class="t" x="384" y="438">Feature, bug fixing, refactor,</text>
    <text class="t" x="384" y="456">testing, review, planning, …</text>
    <text class="s" x="384" y="474">each request · 10 kinds</text>

    <text class="h4" x="604" y="418">Area</text>
    <text class="t" x="604" y="438">Frontend, backend, data, infra,</text>
    <text class="t" x="604" y="456">tooling, docs, non-code</text>
    <text class="s" x="604" y="474">each request · editable</text>

    <text class="h4" x="824" y="418">Complexity</text>
    <text class="t" x="824" y="438">Routine, everyday, complex,</text>
    <text class="t" x="824" y="456">high-impact</text>
    <text class="s" x="824" y="474">each request</text>

    <text class="h4" x="1028" y="418">Pushback</text>
    <text class="t" x="1028" y="438">Did you say the previous</text>
    <text class="t" x="1028" y="456">answer was wrong?</text>
    <text class="s" x="1028" y="474">every follow-up · yes or no</text>
  </g>

  <!-- Section: outcomes, tiers, tags -->
  <text class="eye" x="60" y="540">FROM LABELS TO INSIGHTS</text>
  <rect class="card" x="60" y="556" width="720" height="262" rx="12"/>
  <text class="h3" x="84" y="592">How a session ended</text>
  <g transform="translate(84 616)">
    <rect width="96" height="30" rx="15" fill="rgba(95,138,223,.18)" stroke="#5f8adf"/>
    <text x="48" y="20" text-anchor="middle" style="font-size:12px;font-weight:700">Request</text>
    <path d="M100 15H140" class="line"/>
    <circle cx="156" cy="15" r="11" fill="#66d990"/>
    <text x="156" y="49" text-anchor="middle" class="s">fine</text>
    <path d="M168 15H208" class="line"/>
    <circle cx="224" cy="15" r="11" fill="#ff6f6f"/>
    <text x="224" y="49" text-anchor="middle" class="s">pushback</text>
    <path d="M236 15H276" class="line"/>
    <circle cx="292" cy="15" r="11" fill="#66d990"/>
    <text x="292" y="49" text-anchor="middle" class="s">fine</text>
    <path d="M306 15H350" class="line" marker-end="url(#arrow)"/>
    <rect x="356" width="150" height="30" rx="15" fill="rgba(255,180,87,.14)" stroke="#ffb457"/>
    <text x="431" y="20" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#ffb457">Recovered</text>
  </g>
  <g transform="translate(84 690)">
    <rect width="12" height="12" rx="3" y="-10" fill="#66d990"/>
    <text class="h4" x="22" y="0">Accepted</text>
    <text class="t" x="118" y="0">follow-ups, none of them pushback</text>
    <rect width="12" height="12" rx="3" y="18" fill="#ffb457"/>
    <text class="h4" x="22" y="28">Recovered</text>
    <text class="t" x="118" y="28">pushback, but the last follow-up was fine</text>
    <rect width="12" height="12" rx="3" y="46" fill="#ff6f6f"/>
    <text class="h4" x="22" y="56">Ended on pushback</text>
    <text class="t" x="166" y="56">the last follow-up was a pushback</text>
  </g>
  <text class="t" x="84" y="784">Resolved = accepted or recovered.</text>
  <text class="t" x="84" y="804">Cost per resolved task = spend on resolved tasks ÷ how many.</text>
  <text class="s" x="520" y="804">Rates under 20 follow-ups say “few”.</text>

  <rect class="card" x="820" y="556" width="720" height="262" rx="12"/>
  <text class="h3" x="844" y="592">Model tiers and session tags</text>
  <g transform="translate(844 610)">
    <rect width="208" height="24" rx="5" fill="#026e8b"/>
    <rect x="212" width="208" height="24" rx="5" fill="#0594ba"/>
    <rect x="424" width="248" height="24" rx="5" fill="#02bceb"/>
    <text x="104" y="16" text-anchor="middle" style="font-size:12px;font-weight:700">Light</text>
    <text x="316" y="16" text-anchor="middle" style="font-size:12px;font-weight:700">Standard</text>
    <text x="548" y="16" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#05222b">Premium</text>
    <text class="t" x="0" y="48">Your own models, ranked by price per token into thirds.</text>
  </g>
  <g transform="translate(844 684)" style="font-size:12px;font-weight:700">
    <rect width="98" height="26" rx="13" fill="rgba(153,121,205,.16)" stroke="#9979cd"/><text x="49" y="17" text-anchor="middle">Marathon</text>
    <rect x="108" width="108" height="26" rx="13" fill="rgba(7,155,194,.16)" stroke="#079bc2"/><text x="162" y="17" text-anchor="middle">Long thread</text>
    <rect x="226" width="104" height="26" rx="13" fill="rgba(193,122,1,.16)" stroke="#c17a01"/><text x="278" y="17" text-anchor="middle">Big spender</text>
    <rect x="340" width="124" height="26" rx="13" fill="rgba(95,138,223,.16)" stroke="#5f8adf"/><text x="402" y="17" text-anchor="middle">Subagent team</text>
    <rect x="474" width="88" height="26" rx="13" fill="rgba(255,180,87,.14)" stroke="#ffb457"/><text x="518" y="17" text-anchor="middle">Overkill</text>
    <rect x="572" width="120" height="26" rx="13" fill="rgba(255,180,87,.14)" stroke="#ffb457"/><text x="632" y="17" text-anchor="middle">Underpowered</text>
    <rect y="36" width="90" height="26" rx="13" fill="rgba(255,180,87,.14)" stroke="#c1a35a"/><text x="45" y="53" text-anchor="middle">Rescued</text>
    <rect x="100" y="36" width="150" height="26" rx="13" fill="rgba(255,111,111,.14)" stroke="#ff6f6f"/><text x="175" y="53" text-anchor="middle">Ended on pushback</text>
    <rect x="260" y="36" width="92" height="26" rx="13" fill="rgba(102,217,144,.14)" stroke="#66d990"/><text x="306" y="53" text-anchor="middle">One-shot</text>
  </g>
  <text class="t" x="844" y="776">Tags are computed from cost, time, requests, subagents, tier, and outcome.</text>
  <text class="t" x="844" y="796">Top-10% tags need enough sessions to compare; a session can have several.</text>

  <!-- Section: page order -->
  <text class="eye" x="60" y="872">THE PAGE, TOP TO BOTTOM</text>
  <g>
    <rect class="card" x="60" y="888" width="480" height="92" rx="12"/>
    <rect x="60" y="904" width="4" height="60" rx="2" fill="#66d990"/>
    <text class="h3" x="84" y="920">Right-sizing</text>
    <text class="t" x="84" y="944">Suggestions with savings, then spend split by</text>
    <text class="t" x="84" y="963">model tier and reasoning effort per complexity.</text>

    <rect class="card" x="560" y="888" width="480" height="92" rx="12"/>
    <rect x="560" y="904" width="4" height="60" rx="2" fill="#079bc2"/>
    <text class="h3" x="584" y="920">Where the spend went</text>
    <text class="t" x="584" y="944">Spend by area with a trend line, and how</text>
    <text class="t" x="584" y="963">sessions ended.</text>

    <rect class="card" x="1060" y="888" width="480" height="92" rx="12"/>
    <rect x="1060" y="904" width="4" height="60" rx="2" fill="#9979cd"/>
    <text class="h3" x="1084" y="920">Session tags</text>
    <text class="t" x="1084" y="944">Count, spend, share, and resolved rate for</text>
    <text class="t" x="1084" y="963">each tag. Select one to see its sessions.</text>

    <rect class="card" x="60" y="996" width="480" height="92" rx="12"/>
    <rect x="60" y="1012" width="4" height="60" rx="2" fill="#5f8adf"/>
    <text class="h3" x="84" y="1028">When you work</text>
    <text class="t" x="84" y="1052">Session starts by weekday and hour, and</text>
    <text class="t" x="84" y="1071">pushback by time of day, night to evening.</text>

    <rect class="card" x="560" y="996" width="480" height="92" rx="12"/>
    <rect x="560" y="1012" width="4" height="60" rx="2" fill="#c36b95"/>
    <text class="h3" x="584" y="1028">Pushback and cost per resolved</text>
    <text class="t" x="584" y="1052">Weekly pushback rate, and what a resolved</text>
    <text class="t" x="584" y="1071">session costs for each kind of work.</text>

    <rect class="card" x="1060" y="996" width="480" height="92" rx="12"/>
    <rect x="1060" y="1012" width="4" height="60" rx="2" fill="#af851e"/>
    <text class="h3" x="1084" y="1028">Model choices</text>
    <text class="t" x="1084" y="1052">Top models by spend: pushback, resolved</text>
    <text class="t" x="1084" y="1071">share, and cost per resolved session.</text>
  </g>

  <!-- Section: suggestions -->
  <text class="eye" x="60" y="1142">HOW SUGGESTIONS ARE CHOSEN</text>
  <text class="s" x="330" y="1142">at least 3 sessions each · ranked by saving · savings are estimates and can overlap</text>
  <g>
    <rect class="card" x="60" y="1158" width="480" height="112" rx="12"/>
    <text class="h4" x="84" y="1188">Try a cheaper model</text>
    <text class="t" x="84" y="1210">Same kind of work and complexity. Cheaper per token,</text>
    <text class="t" x="84" y="1229">as often, similar pushback, ≤ 70% cost per resolved.</text>
    <text class="num" x="84" y="1254">Saving = cost difference × resolved sessions</text>

    <rect class="card" x="560" y="1158" width="480" height="112" rx="12"/>
    <text class="h4" x="584" y="1188">Use a newer version of the same model</text>
    <text class="t" x="584" y="1210">Same app and family, newer, cheaper per token,</text>
    <text class="t" x="584" y="1229">resolves about as often (e.g. Opus 4.8 → Opus 5.5).</text>
    <text class="num" x="584" y="1254">Saving = spend × (1 − new ÷ current price)</text>

    <rect class="card" x="1060" y="1158" width="480" height="112" rx="12"/>
    <text class="h4" x="1084" y="1188">Try a mid-priced model for routine work</text>
    <text class="t" x="1084" y="1210">Routine requests on premium models, with a</text>
    <text class="t" x="1084" y="1229">standard model named for each app.</text>
    <text class="num" x="1084" y="1254">Saving = spend × (1 − standard ÷ premium price)</text>

    <rect class="card" x="60" y="1284" width="480" height="112" rx="12"/>
    <text class="h4" x="84" y="1314">Lower reasoning effort on routine work</text>
    <text class="t" x="84" y="1336">Routine requests run at xhigh, max, or ultra</text>
    <text class="t" x="84" y="1355">effort.</text>
    <text class="s" x="84" y="1380">No estimate: traces can’t show the lower-effort cost</text>

    <rect class="card" x="560" y="1284" width="480" height="112" rx="12"/>
    <text class="h4" x="584" y="1314">Use a stronger model for complex work</text>
    <text class="t" x="584" y="1336">Complex work on light models gets more pushback</text>
    <text class="t" x="584" y="1355">than your typical model and complexity mix.</text>
    <text class="s" x="584" y="1380">Usually costs more, so no saving is shown</text>

    <rect class="card" x="1060" y="1284" width="480" height="112" rx="12"/>
    <text class="h4" x="1084" y="1314">Start a fresh session sooner</text>
    <text class="t" x="1084" y="1336">Sessions with 30+ requests cost ≥ 1.5× more per</text>
    <text class="t" x="1084" y="1355">request than sessions with 10 or fewer.</text>
    <text class="num" x="1084" y="1380">Saving = cost at the short-session rate (upper bound)</text>
  </g>

  <!-- Section: setup -->
  <text class="eye" x="60" y="1448">SETUP, WHEN YOU TURN IT ON</text>
  <g style="font-size:13px">
    <path d="M60 1462h268l22 40-22 40H60z" fill="rgba(0,188,235,.12)" stroke="rgba(0,188,235,.55)"/>
    <text class="h4" x="80" y="1494">Turn on Work insights</text>
    <text class="s" x="80" y="1514">Settings · off by default</text>

    <path d="M356 1462h276l22 40-22 40H356l22-40z" fill="url(#panel)" stroke="rgba(255,255,255,.12)"/>
    <text class="h4" x="392" y="1494">Use your Ollama, or install</text>
    <text class="s" x="392" y="1514">pinned 0.34.4 · SHA-256 + code signature</text>

    <path d="M660 1462h276l22 40-22 40H660l22-40z" fill="url(#panel)" stroke="rgba(255,255,255,.12)"/>
    <text class="h4" x="696" y="1494">Download the Jet model</text>
    <text class="s" x="696" y="1514">8.4 GB · every file hash-checked</text>

    <path d="M964 1462h276l22 40-22 40H964l22-40z" fill="url(#panel)" stroke="rgba(255,255,255,.12)"/>
    <text class="h4" x="1000" y="1494">Import as a 4-bit model</text>
    <text class="s" x="1000" y="1514">then delete the download (~3 GB kept)</text>

    <path d="M1268 1462h272v80H1268l22-40z" fill="rgba(102,217,144,.10)" stroke="rgba(102,217,144,.5)"/>
    <text class="h4" x="1304" y="1494" style="fill:#66d990">Label in the background</text>
    <text class="s" x="1304" y="1514">5 a minute · pause any time</text>
  </g>

  <text class="s" x="60" y="1576">Labels are estimates from a small local model. Full rules: specs/WORK_INSIGHTS.md</text>
</svg>
