name: Install checks

# Installs the backend on clean Linux and Windows hosts, checks the running
# service, then uninstalls. Tray companions need a desktop session that hosted
# runners do not reliably provide, so they are not covered here.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/install-checks.yml"
      - ".github/scripts/write_sample_trace.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN_METER_READINESS_TIMEOUT_SECONDS: "600"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Hosted runners have no logged-in user session; lingering starts the
      # systemd user manager the installer expects from a desktop login.
      - name: Start a systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          for _ in $(seq 1 30); do
            systemctl --user show-environment >/dev/null 2>&1 && break
            sleep 1
          done
          systemctl --user show-environment >/dev/null
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Add a sample session
        run: python3 .github/scripts/write_sample_trace.py

      - name: Install
        run: ./scripts/install --backend-only

      - name: Check the installation
        run: |
          runtime="${XDG_DATA_HOME:-$HOME/.local/share}/token-meter/runtime"
          systemctl --user is-active --quiet token-meter-server.service
          test "$(cat "$runtime/INSTALL_MODE")" = "backend-only"
          curl -fsS --max-time 10 http://127.0.0.1:8722/health | python3 -c '
          import json, sys
          health = json.load(sys.stdin)
          assert health.get("ok") and health.get("state_ready"), health
          assert health.get("sources", 0) >= 1, health
          assert not health.get("runtime_adapter_failures"), health
          print("health ok:", health["sources"], "session(s) indexed")
          '
          curl -fsS --max-time 10 http://127.0.0.1:8722/menubar | python3 -c 'import json, sys; json.load(sys.stdin); print("menubar ok")'

      - name: Uninstall
        run: |
          runtime="${XDG_DATA_HOME:-$HOME/.local/share}/token-meter/runtime"
          "$runtime/scripts/uninstall-systemd-user"
          if systemctl --user is-active --quiet token-meter-server.service; then
            echo "token-meter-server.service is still running" >&2
            exit 1
          fi
          if curl -fsS --max-time 3 http://127.0.0.1:8722/health >/dev/null 2>&1; then
            echo "the server still answers after uninstall" >&2
            exit 1
          fi
          echo "uninstall ok"

      - name: Show server logs
        if: failure()
        run: journalctl --user -u token-meter-server.service -n 200 --no-pager || true

  windows:
    name: Windows install
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add a sample session
        run: python .github/scripts/write_sample_trace.py

      - name: Install
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File scripts\install-windows.ps1 -BackendOnly -ReadinessTimeoutSeconds 600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the installation
        shell: powershell
        run: |
          $Runtime = Join-Path $env:LOCALAPPDATA "Token Meter\runtime"
          $Health = Invoke-RestMethod -Uri "http://127.0.0.1:8722/health" -TimeoutSec 10
          if (-not $Health.ok -or -not $Health.state_ready) { throw "server is not ready: $($Health | ConvertTo-Json -Compress)" }
          if ($Health.sources -lt 1) { throw "no sessions were indexed: $($Health | ConvertTo-Json -Compress)" }
          if (@($Health.runtime_adapter_failures).Count -gt 0) { throw "runtime adapters failed: $($Health | ConvertTo-Json -Compress)" }
          Write-Host "health ok: $($Health.sources) session(s) indexed"
          $null = Invoke-RestMethod -Uri "http://127.0.0.1:8722/menubar" -TimeoutSec 10
          Write-Host "menubar ok"
          $Mode = (Get-Content -LiteralPath (Join-Path $Runtime "INSTALL_MODE") -Raw).Trim()
          if ($Mode -ne "backend-only") { throw "unexpected install mode: $Mode" }
          $RunKey = "Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not (Get-ItemProperty -LiteralPath $RunKey -Name "Token Meter" -ErrorAction SilentlyContinue)) {
            throw "the login startup entry is missing"
          }
          Write-Host "startup entry ok"

      - name: Uninstall
        shell: powershell
        run: |
          $Runtime = Join-Path $env:LOCALAPPDATA "Token Meter\runtime"
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $Runtime "scripts\uninstall-windows.ps1")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $RunKey = "Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run"
          if (Get-ItemProperty -LiteralPath $RunKey -Name "Token Meter" -ErrorAction SilentlyContinue) {
            throw "the login startup entry is still present"
          }
          $StillServing = $true
          try { $null = Invoke-RestMethod -Uri "http://127.0.0.1:8722/health" -TimeoutSec 3 } catch { $StillServing = $false }
          if ($StillServing) { throw "the server still answers after uninstall" }
          Write-Host "uninstall ok"

      - name: Show server logs
        if: failure()
        shell: powershell
        run: |
          $Runtime = Join-Path $env:LOCALAPPDATA "Token Meter\runtime"
          foreach ($Name in @("meter.err.log", "meter.log")) {
            $Path = Join-Path $Runtime $Name
            if (Test-Path -LiteralPath $Path) { Write-Host "== $Name"; Get-Content -LiteralPath $Path -Tail 200 }
          }
